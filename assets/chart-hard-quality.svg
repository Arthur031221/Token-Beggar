<text x="42.0" y="63.0" font-size="12" fill="#6f5f4d" text-anchor="start" font-weight="normal">Without Token Beggar</text>
<rect x="200.0" y="52" width="12" height="12" rx="2" fill="#c8742b"/>
<text x="218.0" y="63.0" font-size="12" fill="#6f5f4d" text-anchor="start" font-weight="normal">With Token Beggar (v0.3.0)</text>
