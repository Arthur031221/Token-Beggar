<text x="24.0" y="186.0" font-size="12" fill="#2b2118" text-anchor="start" font-weight="normal">Share of issues resolved, scored by the maintainers' hidden tests, 3 runs per task (54 per setup).</text>
<text x="24.0" y="206.0" font-size="12" fill="#6f5f4d" text-anchor="start" font-weight="normal">Higher is better. 70% against 69% is a tie within the spread.</text>
