[project]
name = "token-beggar"
version = "0.3.0"
description = "Routes every task to the cheapest model and effort that keeps the answer the same."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[tool.ruff]
line-length = 150
extend-exclude = ["benchmark/base_shop"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmark/*.py" = ["E501"]
"tests/*.py" = ["E501"]
