name: update-models
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data/models.json from the public models page
        run: python3 -m token_beggar update --repo
      - name: Run the tests against the new catalog
        run: python3 -m unittest discover -s tests -t .
      - name: Open a pull request when the catalog changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The date alone changes every run, so compare the model rows only.
          if git diff --quiet -I'"updated"' data/models.json; then
            echo "Catalog unchanged."
            exit 0
          fi
          branch="models-$(date +%Y-%m-%d)"
          git config user.name "token-beggar-bot"
          git config user.email "token-beggar-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/models.json
          git commit -m "Refresh model catalog"
          git push origin "$branch"
          gh pr create --title "Refresh model catalog" --body "Automatic weekly refresh of data/models.json from the public models page." --base main
